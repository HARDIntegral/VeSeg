[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"


[project]
name = "veseg"
version = "0.1.0"
description = "Vascular segmentation toolkit for microscopy and visible-light vessel images"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
	{name = "Mohammed Tazwar"},
]
keywords = [
	"segmentation",
	"medical imaging",
	"vascular",
	"deep learning",
	"u-net",
	"computer vision",
]
classifiers = [
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.10",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
	"Topic :: Scientific/Engineering :: Artificial Intelligence",
	"Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
	"numpy",
	"torch",
	"Pillow",
	"matplotlib",
]


[project.optional-dependencies]
dev = [
	"pytest",
	"pytest-cov",
]



[tool.maturin]
manifest-path = "veseg_core/Cargo.toml"
python-source = "src"
module-name = "veseg.veseg_core"
features = ["pyo3/extension-module"]
include = [
	"src/veseg/checkpoints/*.pt",
]

[tool.setuptools.package-data]
veseg = [
	"checkpoints/*.pt",
]


[project.urls]
Homepage = "https://github.com/HARDIntegral/VeSeg"
Repository = "https://github.com/HARDIntegral/VeSeg"
Issues = "https://github.com/HARDIntegral/VeSeg/issues"